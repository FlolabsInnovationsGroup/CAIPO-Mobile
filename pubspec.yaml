name: caipoappv0
description: "flomad_caipo"
publish_to: 'none' # Not published to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Firebase - updated to current stable versions
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.9
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.8
  google_sign_in: ^6.1.6
  desktop_webview_auth: ^0.0.12
  url_launcher: ^6.2.2
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  
  # Downgraded to be compatible with dialogflow_flutter
  http: ^0.13.6
  
  # UI components
  flutter_spinkit: ^5.2.0
  font_awesome_flutter: ^10.6.0
  # Downgraded to be compatible with http ^0.13.6
  google_fonts: ^4.0.4
  
  # State management
  provider: ^6.1.1
  get_it: ^7.6.4
  injectable: ^2.3.2
  
  # Utilities
  # Updated to match the version required by flutter_localizations
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  file_picker: ^5.3.3
  speech_to_text: ^6.3.0
  xml: ^6.3.0
  
  # APIs
  dialogflow_flutter: ^1.0.0
  googleapis_auth: ^1.4.1
  flutter_sound: ^9.2.13
  image_picker: ^1.0.4
  shared_preferences: ^2.2.2
  audio_waveforms: ^1.0.4
  video_player: ^2.7.2
  permission_handler: ^11.0.1
  path: ^1.8.3
  share_plus: ^7.2.1
  path_provider: ^2.1.1

  # Network
  dio: ^5.3.3
  connectivity_plus: ^5.0.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utils
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.0.2
  freezed_annotation: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  test: ^1.24.3
  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  injectable_generator: ^2.4.1
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  mockito: ^5.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - .env
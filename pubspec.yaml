  intl: ^0.19.0
  flutter_dotenv: ^5.2.1
  file_picker: ^9.0.2
  speech_to_text: ^7.0.0
  
  # APIs
  dialogflow_flutter: 1.0.0
  googleapis_auth: 1.4.1
  flutter_sound: ^9.25.4
